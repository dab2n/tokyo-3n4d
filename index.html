<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도쿄 3박 4일</title>
<meta name="description" content="주소를 누르면 구글 지도로 바로 이동하는 도쿄 3박 4일 일정표">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🤍</text></svg>">
<style>
@font-face{
  font-family:"Pretendard Variable";
  src:url("fonts/PretendardVariable.subset.woff2") format("woff2-variations");
  font-weight:100 900;
  font-display:swap;
}
:root{
  --bg:#ffffff;
  --ink:#0B0B0C;
  --ink-2:#4A4A4E;
  --muted:#8E8E93;
  --hair:#EBEBEC;
  --hair-2:#F5F5F6;
  --field:#FAFAFA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  letter-spacing:-0.02em;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.heart{width:1em;height:1em;flex:0 0 auto;display:block}

/* ───────────── 온보딩 ───────────── */
#intro{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
  transition:opacity .5s ease,visibility .5s;
}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}

.stack{
  position:relative;
  width:min(74vw,300px);
  aspect-ratio:4/3;
  margin-bottom:0;
  transition:transform .6s cubic-bezier(.22,1,.36,1);
}
.stack img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  border-radius:2px;
  background:var(--hair-2);
  box-shadow:0 0 0 5px #fff, 0 6px 18px rgba(0,0,0,.13);
  opacity:0;
  transform:translate3d(0,26px,0) scale(.9) rotate(0deg);
}
.stack.go img{
  animation:toss .38s cubic-bezier(.2,.9,.3,1.06) both;
  animation-delay:calc(var(--i) * .115s);
}
@keyframes toss{
  0%{opacity:0;transform:translate3d(0,26px,0) scale(.9) rotate(0deg)}
  60%{opacity:1}
  100%{opacity:1;transform:translate3d(var(--x),var(--y),0) scale(1) rotate(var(--r))}
}
.stack.settle{transform:scale(.9)}

.intro-type{
  text-align:center;
  margin-top:38px;
  opacity:0;transform:translateY(8px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1);
}
.intro-type.in{opacity:1;transform:none}
.intro-eyebrow{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:11px;letter-spacing:.16em;color:var(--muted);
  margin:0 0 14px;
}
.intro-title{
  font-size:clamp(30px,8.6vw,38px);font-weight:800;
  letter-spacing:-0.035em;margin:0;
}
.intro-sub{
  margin:12px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.75;font-weight:400;
}
.intro-skip{
  margin-top:32px;
  font-family:inherit;letter-spacing:inherit;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-size:13px;font-weight:600;
  padding:11px 26px;border-radius:100px;cursor:pointer;
}

/* ───────────── 헤더 ───────────── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(1.4) blur(16px);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid var(--hair);
}
.wrap{max-width:620px;margin:0 auto;padding-left:20px;padding-right:20px}
.brandline{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:16px;
}
.brand{
  display:flex;align-items:center;gap:7px;
  font-size:17px;font-weight:800;letter-spacing:-0.035em;margin:0;
}
.stay{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:500}
.search-wrap{position:relative;margin-top:13px}
#q{
  width:100%;
  font-family:inherit;letter-spacing:inherit;font-size:15px;font-weight:400;
  padding:12px 38px 12px 40px;
  border:1px solid var(--hair);border-radius:12px;
  background:var(--field);color:var(--ink);
}
#q::placeholder{color:var(--muted)}
#q:focus{background:#fff;border-color:var(--ink);outline:none}
.s-ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted);
}
.s-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--muted);
  font-size:19px;line-height:1;cursor:pointer;padding:6px 10px;display:none;
  font-family:inherit;
}
.chips{
  display:flex;gap:6px;overflow-x:auto;padding:13px 0 14px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;letter-spacing:inherit;font-size:13px;font-weight:600;
  padding:8px 15px;border-radius:100px;cursor:pointer;
  border:1px solid var(--hair);background:#fff;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .heart{display:none}
.chip[aria-pressed="true"] .heart{display:block}

/* ───────────── 스케줄 ───────────── */
main{max-width:620px;margin:0 auto;padding:0 20px 80px}
.day{padding-top:38px;scroll-margin-top:160px}
.day-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.day-num{
  font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.day-rule{flex:1;height:1px;background:var(--hair)}
.day-title{font-size:21px;font-weight:800;letter-spacing:-0.035em;margin:0}
.day-meta{margin:6px 0 20px;font-size:12.5px;color:var(--muted);line-height:1.65;font-weight:400}

.item{
  display:grid;grid-template-columns:50px 1fr;gap:14px;
  padding:16px 0;border-top:1px solid var(--hair-2);
}
.day .item:first-of-type{border-top:0;padding-top:0}
.time{
  font-size:13px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;padding-top:1px;
}
.kind{
  font-size:10.5px;font-weight:600;color:var(--muted);
  letter-spacing:.1em;margin:0 0 4px;
}
.name{font-size:15.5px;font-weight:700;margin:0;line-height:1.45;letter-spacing:-0.028em}
.addr{
  display:inline-flex;align-items:center;gap:7px;
  margin-top:9px;
  font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;
  background:#fff;border:1px solid var(--hair);
  padding:8px 12px;border-radius:10px;line-height:1.35;
}
.addr:active{background:var(--hair-2)}
.addr .go{color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}
.move{
  margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65;font-weight:400;
  padding-left:15px;position:relative;
}
.move::before{
  content:"";position:absolute;left:0;top:9px;
  width:8px;height:1px;background:var(--muted);opacity:.55;
}
.note{
  display:flex;align-items:flex-start;gap:6px;
  margin:8px 0 0;font-size:12px;color:var(--ink);font-weight:600;line-height:1.5;
}
.note .heart{margin-top:2px}
.empty{
  text-align:center;color:var(--muted);font-size:14px;
  padding:70px 20px;display:none;font-weight:500;
}
footer{
  max-width:620px;margin:0 auto;padding:32px 20px 60px;
  border-top:1px solid var(--hair);
  font-size:12px;color:var(--muted);line-height:1.8;font-weight:400;
}
@media (prefers-reduced-motion:reduce){
  .stack.go img{animation-duration:.01ms;animation-delay:0s}
  .stack,.intro-type,#intro{transition:none}
}
</style>
</head>

  <div class="day-head"><span class="day-num">DAY ${d.n}</span><span class="day-rule"></span></div>
  <h2 class="day-title">${esc(d.title)}</h2>
  <p class="day-meta">${esc(d.meta)}</p>
  ${d.items.map(it=>`
  <article class="item" data-day="${d.n}" data-s="${esc((it.name+' '+it.addr+' '+it.move+' '+it.k+' '+(it.note||'')).toLowerCase())}">
    <div class="time">${it.t}</div>
    <div>
      <p class="kind">${esc(it.k)}</p>
      <p class="name">${esc(it.name)}</p>
      <a class="addr" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.q)}">
        ${heart}<span>${esc(it.addr)}</span><span class="go">지도 열기 ↗</span>
      </a>
      <p class="move">${esc(it.move)}</p>
      ${it.note?`<p class="note">${heart}<span>${esc(it.note)}</span></p>`:''}
    </div>
  </article>`).join('')}
</section>`).join('');

const chips=document.getElementById('chips');
chips.innerHTML=`<button class="chip" data-day="0" aria-pressed="true">${heart}<span>전체</span></button>`+
  DAYS.map(d=>`<button class="chip" data-day="${d.n}" aria-pressed="false">${heart}<span>Day ${d.n}</span></button>`).join('');

let activeDay=0;
const q=document.getElementById('q'), emptyEl=document.getElementById('empty'), clearBtn=document.getElementById('clear');

function apply(){
  const term=q.value.trim().toLowerCase();
  let shown=0;
  DAYS.forEach(d=>{
    const sec=document.getElementById('day'+d.n);
    let visible=0;
    sec.querySelectorAll('.item').forEach(it=>{
      const on=(activeDay===0||activeDay===+it.dataset.day)&&(!term||it.dataset.s.includes(term));
      it.style.display=on?'':'none';
      if(on){visible++;shown++;}
    });
    sec.style.display=visible?'':'none';
  });
  emptyEl.style.display=shown?'none':'block';
  clearBtn.style.display=term?'block':'none';
}
chips.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  activeDay=+b.dataset.day;
  chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
  apply();
  window.scrollTo({top:0,behavior:'smooth'});
});
q.addEventListener('input',apply);
clearBtn.addEventListener('click',()=>{q.value='';apply();q.focus();});

/* ───────── 온보딩 모션 ───────── */
const POSE=[
  {x:'-14px',y:'10px',r:'-9deg'},
  {x:'16px', y:'-8px', r:'7deg'},
  {x:'-8px', y:'-14px',r:'-4deg'},
  {x:'12px', y:'12px', r:'10deg'},
  {x:'-16px',y:'-4px', r:'-6deg'},
  {x:'8px',  y:'-12px',r:'4deg'},
  {x:'0px',  y:'0px',  r:'-1deg'}
];
const stack=document.getElementById('stack');
const introType=document.getElementById('introType');
const intro=document.getElementById('intro');

stack.innerHTML=POSE.map((p,i)=>
  `<img src="photos/p${i+1}.jpg" alt="" decoding="async"
    style="--i:${i};--x:${p.x};--y:${p.y};--r:${p.r}">`).join('');

function play(){
  stack.classList.add('go');
  const last=(POSE.length-1)*115+380;
  setTimeout(()=>{stack.classList.add('settle');introType.classList.add('in');},last);
  setTimeout(endIntro,last+2000);
}
function endIntro(){
  if(intro.classList.contains('done'))return;
  intro.classList.add('done');
  try{sessionStorage.setItem('tk','1');}catch(e){}
}

let seen=false;
try{seen=sessionStorage.getItem('tk')==='1';}catch(e){}
if(seen){
  intro.style.transition='none';
  intro.classList.add('done');
}else{
  document.getElementById('skip').addEventListener('click',endIntro);
  const imgs=[...stack.querySelectorAll('img')];
  const ready=Promise.all(imgs.map(im=>im.decode().catch(()=>{})));
  Promise.race([ready,new Promise(r=>setTimeout(r,2500))]).then(play);
}
</script>
